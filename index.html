<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="robots" content="noindex,nofollow">
<title>SGS Çalışma</title>
<link rel="manifest" href="app.webmanifest">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mut:#6b7280;--line:#e5e1d8;--nav:#14213d;--acc:#b08d3c;--ok:#17803d;--bad:#b42318;--soft:#efe9dc;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1b1f24;--ink:#e8e6e1;--mut:#9aa1ab;--line:#2b3036;--soft:#23282e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:20;background:var(--nav);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .back{background:none;border:0;color:#fff;font-size:22px;padding:0 6px}
main{max-width:980px;margin:0 auto;padding:16px 16px 96px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button b{font-size:20px;font-weight:400}
nav.tabs button.on{color:var(--nav)}
@media (prefers-color-scheme:dark){nav.tabs button.on{color:var(--acc)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.subj{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.subj h3{margin:0 0 4px;font-size:16px}
.mut{color:var(--mut);font-size:14px}
.bar{height:7px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc)}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--nav);color:#fff;font-weight:600}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.small{padding:7px 11px;font-size:14px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h2{font-size:20px;margin:6px 0 12px}
h3.sec{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:20px 0 8px}
.lock{min-height:100vh;display:grid;place-items:center;padding:24px}
.lock .card{max-width:380px;width:100%;text-align:center;padding:28px}
input[type=password],input[type=text],textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.qwrap{position:relative;background:#fff;border-radius:12px;border:1px solid var(--line);overflow:hidden;touch-action:pan-y}
.qwrap img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
@media (prefers-color-scheme:dark){.qwrap img{filter:invert(.9) hue-rotate(180deg)}}
.qwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.qwrap.draw{touch-action:none}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.opts button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:14px 0;font-size:20px;font-weight:700}
.opts button.sel{border-color:var(--nav)}
.opts button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opts button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}
.tools button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:14px}
.tools button.on{background:var(--nav);color:#fff;border-color:var(--nav)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);padding:0!important}
.verdict{font-weight:700;margin:6px 0}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;background:var(--soft);font-size:12px;color:var(--mut)}
.qnav{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.qnav button{width:34px;height:30px;border:1px solid var(--line);background:var(--card);border-radius:7px;font-size:12px}
.qnav button.a{background:var(--soft)}.qnav button.cur{border-color:var(--nav);border-width:2px}
.qnav button.ok{background:var(--ok);color:#fff}.qnav button.bad{background:var(--bad);color:#fff}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .card{width:100%;max-width:640px;border-radius:18px 18px 0 0;margin:0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat b{display:block;font-size:24px}
.page img{width:100%;display:block}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:14px}
table.res{width:100%;border-collapse:collapse;font-size:14px}table.res td,table.res th{padding:7px;border-bottom:1px solid var(--line);text-align:left}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--soft);border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
.lesson{line-height:1.65}.lesson h2{font-size:21px;margin:4px 0 10px}.lesson h3{font-size:17px;margin:22px 0 8px;color:var(--nav)}
@media (prefers-color-scheme:dark){.lesson h3{color:var(--acc)}}
.lesson .kutu{border-radius:12px;padding:12px 14px;margin:12px 0;border-left:5px solid var(--acc);background:var(--soft)}
.lesson .kutu b.bas{display:block;margin-bottom:4px}
.lesson .cqc{display:inline-block;font-size:.75em;padding:1px 6px;border-radius:8px;background:#e8eefc;color:#2a4a9a;margin-right:4px}
details.cq.px>summary{color:#2f7a4a}
details.cq.cl>summary{color:#8a4b00}
.kutu.hikaye{background:#fff7e8;border-left:4px solid #e0a030}.kutu.guncel{background:#eaf6ff;border-left:4px solid #3a8fd6}
.lesson button.anl{margin-left:8px;font-size:12px;padding:3px 9px;border-radius:14px;border:1px solid #d9b46a;background:#fff7e8;color:#8a4b00;font-weight:500;vertical-align:middle;cursor:pointer}.lesson .cqq>button.anl{margin:8px 0 0}
details.cq{margin:14px 0;border:1px solid var(--line,#ddd);border-radius:12px;background:var(--card,#fff)}
.lesson details.cq>summary{cursor:pointer;padding:10px 14px;font-weight:600;color:var(--acc)}
.lesson .cqq{border-top:1px solid var(--line,#e5e5e5);padding:10px 14px}
.lesson .cqm{font-size:12px;opacity:.7;margin-bottom:4px}
.lesson .cqs{margin:0 0 6px;font-weight:500}
.lesson ol.cqo{list-style:none;padding:0;margin:0 0 6px}.lesson ol.cqo li{margin:2px 0}
.lesson details.cqa summary{cursor:pointer;font-size:14px;color:var(--acc)}
.lesson .kutu.sinav{border-left-color:#c0392b}

.lesson .meslek{border-left-color:#2f6f4f}.lesson .dikkat{border-left-color:var(--bad)}.lesson .ornek{border-left-color:#1d4ed8}
.lesson table{border-collapse:collapse;width:100%;margin:10px 0;font-size:15px}.lesson td,.lesson th{border:1px solid var(--line);padding:6px 8px;text-align:left}
.lesson th{background:var(--soft)}.lesson td.n{text-align:right;font-variant-numeric:tabular-nums}
.lesson .yev td:first-child{width:58%}.lesson details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0}
.lesson summary{font-weight:600;cursor:pointer}
.lesson td.kapali{color:transparent;background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 6px,var(--card) 6px,var(--card) 12px);cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ====== Sabitler ====== */
const SUBJ = [
  {id:'fm',  ad:'Finansal Muhasebe', grup:'Alan'},
  {id:'std', ad:'Muhasebe Standartları (TMS/TFRS)', grup:'Alan'},
  {id:'mlt', ad:'Maliyet Muhasebesi', grup:'Alan'},
  {id:'anz', ad:'Finansal Tablolar Analizi', grup:'Alan'},
  {id:'dnt', ad:'Denetim', grup:'Alan'},
  {id:'eko', ad:'Ekonomi', grup:'Alan'},
  {id:'mly', ad:'Maliye', grup:'Alan'},
  {id:'vrg', ad:'Vergi Hukuku', grup:'Hukuk'},
  {id:'tic', ad:'Ticaret Hukuku', grup:'Hukuk'},
  {id:'brc', ad:'Borçlar Hukuku', grup:'Hukuk'},
  {id:'is',  ad:'İş ve SGK Hukuku', grup:'Hukuk'},
  {id:'mes', ad:'Meslek Hukuku', grup:'Hukuk'},
  {id:'gk',  ad:'Genel Kültür ve Yetenek', grup:'Genel'},
  {id:'ing', ad:'İngilizce', grup:'Genel'},
];
const SUBJ_AD = Object.fromEntries(SUBJ.map(s=>[s.id,s.ad]));
const BOX_DAYS = [1,3,7,16,35];
const DAY = 864e5;
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = ()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};

/* ====== Depolama ====== */
const idb = (()=>{let p;function db(){return p||(p=new Promise((res,rej)=>{const r=indexedDB.open('sgs',2);r.onupgradeneeded=()=>{const d=r.result;for(const s of['kv','ink'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
  async function op(store,mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})}
  return{get:(s,k)=>op(s,'readonly',o=>o.get(k)),set:(s,k,v)=>op(s,'readwrite',o=>o.put(v,k)),del:(s,k)=>op(s,'readwrite',o=>o.delete(k)),keys:s=>op(s,'readonly',o=>o.getAllKeys())}})();

let S = {ans:{}, marks:{}, denemeler:{}, daily:{}, set:{pen:'any',per:20}, cards:{}, done:{}, dinlet:{}, feyn:{}, saray:{}, takil:[]};
function loadState(){try{const x=JSON.parse(localStorage.getItem('sgs_state')||'null');if(x)S=Object.assign(S,x)}catch(e){}}
let saveT; function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('sgs_state',JSON.stringify(S))}catch(e){toast('Kayıt alanı doldu, yedek alın')}},150)}

/* ====== Şifre çözme ====== */
const te=new TextEncoder(), td=new TextDecoder();
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let KEY=null, MAN=null;
async function getManifest(){if(MAN)return MAN;const r=await fetch('manifest.json',{cache:'no-cache'}).catch(()=>null);if(r&&r.ok){MAN=await r.json();localStorage.setItem('sgs_man',JSON.stringify(MAN))}else{MAN=JSON.parse(localStorage.getItem('sgs_man')||'null')}return MAN}
async function unlock(pw){
  const m=await getManifest(); if(!m) throw new Error('Bağlantı yok');
  const base=await crypto.subtle.importKey('raw',te.encode(pw.normalize('NFC').trim()),'PBKDF2',false,['deriveKey']);
  const kek=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:ub64(m.kdf.salt),iterations:m.kdf.iter},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(m.key.iv),additionalData:te.encode('sgs-key')},kek,ub64(m.key.data));
  const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  await idb.set('kv','key',k); KEY=k; return k;
}
const PACKS={};
async function loadPack(pid){
  if(PACKS[pid])return PACKS[pid];
  const m=await getManifest(); const info=m.packs[pid]; if(!info) throw new Error('Paket yok: '+pid);
  const url='p/'+info.file; let buf;
  const cache=('caches' in self)?await caches.open('sgs-packs'):null;
  let r=cache&&await cache.match(url);
  if(!r){r=await fetch(url);if(!r.ok)throw new Error('İndirilemedi');if(cache)await cache.put(url,r.clone())}
  buf=new Uint8Array(await r.arrayBuffer());
  const plain=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12),additionalData:te.encode(pid)},KEY,buf.slice(12)));
  const hl=new DataView(plain.buffer).getUint32(0); const head=JSON.parse(td.decode(plain.subarray(4,4+hl)));
  const body=plain.subarray(4+hl); const urls={};
  head.url=f=>{if(urls[f])return urls[f];const [o,l]=head.index[f];return urls[f]=URL.createObjectURL(new Blob([body.subarray(o,o+l)],{type:f.endsWith('.webp')?'image/webp':'application/octet-stream'}))};
  head.raw=f=>{const [o,l]=head.index[f];return body.subarray(o,o+l)};
  head.pid=pid; PACKS[pid]=head; return head;
}
async function packsOf(kind,subject){const m=await getManifest();return Object.entries(m.packs).filter(([k,v])=>(!kind||v.kind===kind)&&(!subject||v.subject===subject)).map(([k,v])=>Object.assign({pid:k},v))}

/* ====== Soru durumu (aralıklı tekrar) ====== */
function record(q,choice){
  const a=S.ans[q.id]||(S.ans[q.id]={n:0,ok:0,box:0,due:0,sub:q.sub});
  const ok=choice===q.ans; a.n++; if(ok)a.ok++; a.last=choice; a.lastOk=ok; a.t=Date.now(); a.sub=q.sub;
  if(ok){a.box=Math.min(a.box+1,BOX_DAYS.length); a.due=a.box>=BOX_DAYS.length?0:today()+BOX_DAYS[a.box-1]*DAY; if(a.box>=2&&a.wrong)a.wrong=a.box<BOX_DAYS.length}
  else{a.box=0;a.wrong=true;a.due=today()+DAY}
  const d=S.daily[today()]||(S.daily[today()]={n:0,ok:0}); d.n++; if(ok)d.ok++;
  save(); return ok;
}
const isDue=a=>a&&a.wrong&&a.due&&a.due<=today()+DAY-1;

/* ====== Arayüz yardımcıları ====== */
const app=$('#app'); let ROUTE=[];
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function shell(title,html,{back=true,tab}={}){
  app.innerHTML=`<header class="top">${back?'<button class="back" data-back>‹</button>':''}<h1>${esc(title)}</h1></header><main>${html}</main>
  <nav class="tabs">${[['bugun','☀','Bugün'],['dersler','📚','Dersler'],['deneme','📝','Deneme'],['hafiza','🧠','Hafıza'],['ayar','⚙','Ayarlar']].map(([k,i,t])=>`<button data-tab="${k}" class="${tab===k?'on':''}"><b>${i}</b>${t}</button>`).join('')}</nav>`;
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-back],[data-go]'); if(!t)return;
  if(t.dataset.tab){ROUTE=[];go(t.dataset.tab)}
  else if(t.dataset.back){history.back()}
  else if(t.dataset.go){go(...JSON.parse(t.dataset.go))}
});
function go(name,...args){ROUTE.push([name,...args]);try{history.pushState({d:ROUTE.length},'')}catch(e){}(VIEWS[name]||VIEWS.bugun)(...args)}
window.addEventListener('popstate',()=>{if(!KEY)return;if(document.querySelector('.sheet')){document.querySelector('.sheet').remove();return}ROUTE.pop();const r=ROUTE.pop();if(r){ROUTE.push(r);(VIEWS[r[0]]||VIEWS.bugun)(...r.slice(1))}else{ROUTE=[['bugun']];VIEWS.bugun()}});
const pct=(a,b)=>b?Math.round(100*a/b):0;

function subjStats(sub){let n=0,ok=0,seen=0,due=0;for(const a of Object.values(S.ans)){if(a.sub!==sub)continue;seen++;n+=a.n;ok+=a.ok;if(isDue(a))due++}return{n,ok,seen,due}}

/* ====== Görünümler ====== */
const VIEWS={};
VIEWS.bugun=async()=>{
  const m=await getManifest();
  const dueAll=Object.values(S.ans).filter(isDue).length;
  const td_=S.daily[today()]||{n:0,ok:0};
  // önerilen ders: en az çalışılan alan dersi (soru bankası olanlar)
  const qp=await packsOf('questions'); const subs=[...new Set(qp.map(p=>p.subject))].filter(s=>s!=='deneme');
  subs.sort((a,b)=>subjStats(a).seen-subjStats(b).seen);
  const oneri=subs.slice(0,2);
  const hafta=Object.entries(S.daily).filter(([k])=>+k>today()-7*DAY).reduce((s,[k,v])=>s+v.n,0);
  const dueC=(await allCards()).filter(cardDue).length, din=dinletDue();
  const lps=(await lessonPacks()).sort((a,b)=>a.pid.localeCompare(b.pid)); const cig=lps.find(p=>!S.done[p.pid]);
  const hafiz=`<h3 class="sec">Günlük tekrar düzeni</h3><div class="card">
   <div class="row" style="justify-content:space-between;margin-bottom:8px"><div><b>1 · Dünün tekrarı</b><div class="mut">Dünkü ve zamanı gelen kartlar</div></div>${dueC?`<button class="btn small" data-go='["kartlar",{}]'>${dueC} kart</button>`:'<span class="pill">✓ yok</span>'}</div>
   <div class="row" style="justify-content:space-between;margin-bottom:8px"><div><b>2 · Anlatarak tekrar</b><div class="mut">Bitirdiğin dersi kendi cümlenle anlat</div></div>${din.length?`<button class="btn small" data-go='["okuma","${din[0].pid}"]'>${din.length} ders</button>`:'<span class="pill">✓ yok</span>'}</div>
   <div class="row" style="justify-content:space-between"><div><b>3 · Yeni ders</b><div class="mut">${cig?esc(cig.title):'Yeni anlatımlar hazırlanıyor'}</div></div>${cig?`<button class="btn small" data-go='["okuma","${cig.pid}"]'>Yeni ders</button>`:''}</div>
  </div>`;
  shell('Bugün',`
   <div class="card"><div class="stat"><div><b>${td_.n}</b><span class="mut">bugün çözülen</span></div><div><b>${pct(td_.ok,td_.n)}%</b><span class="mut">bugünkü başarı</span></div><div><b>${hafta}</b><span class="mut">son 7 gün</span></div></div></div>
   ${dueAll?`<div class="card"><h3 style="margin:0 0 6px">🔁 Tekrar zamanı gelen ${dueAll} soru</h3><p class="mut" style="margin:0 0 10px">Daha önce yanlış yaptığın sorular. Önce bunlar, çünkü unutmadan pekişsinler.</p><button class="btn" data-go='["oturum",{"mode":"due"}]'>Tekrara başla</button></div>`:''}
   ${hafiz}
   <h3 class="sec">Soru çöz</h3>
   ${oneri.map(s=>{const st=subjStats(s);return`<div class="card"><h3 style="margin:0">${esc(SUBJ_AD[s])}</h3><p class="mut" style="margin:4px 0 10px">${st.seen?`${st.seen} farklı soru gördün, başarı %${pct(st.ok,st.n)}`:'Henüz başlamadın. 20 soruluk bir setle tanışalım.'}</p><div class="row"><button class="btn" data-go='["oturum",{"mode":"yeni","sub":"${s}"}]'>${S.set.per} yeni soru</button><button class="btn alt" data-go='["ders","${s}"]'>Derse git</button></div></div>`}).join('')}
   <p class="mut">Sayaç yok, acele yok. Her soruda kalemle karalayabilir, takıldığın yerde <b>Sor</b> düğmesiyle bana sorabilirsin.</p>`,{back:false,tab:'bugun'});
};
VIEWS.dersler=async()=>{
  const qp=await packsOf('questions'), dp=await packsOf('doc');
  const has=s=>qp.filter(p=>p.subject===s).reduce((a,p)=>a+p.count,0);
  let h=`<button class="subj" style="margin-bottom:12px" data-go='["takil"]'><h3>🤔 Takıldıklarım</h3><div class="mut">${(S.takil||[]).length?S.takil.length+' konu seni bekliyor':'Ders içinde "Anlamadım" dediğin yerler burada toplanır'}</div></button>`;
  for(const g of['Alan','Hukuk','Genel']){
    h+=`<h3 class="sec">${g==='Alan'?'Alan bilgisi (100 soru)':g==='Hukuk'?'Hukuk dersleri (alan bilgisinin parçası)':'Genel kültür ve yabancı dil (30 soru)'}</h3><div class="grid">`;
    for(const s of SUBJ.filter(x=>x.grup===g)){const n=has(s.id),st=subjStats(s.id),docs=dp.filter(p=>p.subject===s.id).length;
      h+=`<button class="subj" data-go='["ders","${s.id}"]'><h3>${esc(s.ad)}</h3><div class="mut">${n?n+' soru':'Soru bankası hazırlanıyor'}${docs?' · '+docs+' okuma':''}</div><div class="bar"><i style="width:${n?pct(st.seen,n):0}%"></i></div></button>`}
    h+='</div>';
  }
  shell('Dersler',h,{back:false,tab:'dersler'});
};
VIEWS.ders=async(sub)=>{
  const qp=(await packsOf('questions',sub)), dp=await packsOf('doc',sub), lp=await packsOf('lesson',sub);
  const st=subjStats(sub); const n=qp.reduce((a,p)=>a+p.count,0);
  shell(SUBJ_AD[sub],`
   <div class="card"><div class="stat"><div><b>${st.seen}/${n}</b><span class="mut">görülen soru</span></div><div><b>${pct(st.ok,st.n)}%</b><span class="mut">başarı</span></div><div><b>${st.due}</b><span class="mut">tekrar bekleyen</span></div></div></div>
   ${lp.length?`<h3 class="sec">Sade anlatım</h3>${lp.map(p=>`<button class="subj" style="margin-bottom:8px" data-go='["okuma","${p.pid}"]'><h3>${esc(p.title)}</h3><div class="mut">Benim hazırladığım, örnekli anlatım</div></button>`).join('')}`:''}
   ${(()=>{const pr=dp.filter(p=>!p.pid.startsWith('mk_')),mk=dp.filter(p=>p.pid.startsWith('mk_'));const item=p=>`<button class="subj" style="margin-bottom:8px" data-go='["okuma","${p.pid}"]'><h3>${esc(p.title)}</h3><div class="mut">${p.count} sayfa${S.marks['read_'+p.pid]?' · kaldığın yer: '+(S.marks['read_'+p.pid]+1)+'. sayfa':''}</div></button>`;return (pr.length?`<h3 class="sec">Prensip ders notları</h3>${pr.map(item).join('')}`:'')+(mk.length?`<details class="card" style="padding:10px 14px"><summary><b>Mali Kampüs ders slaytları (${mk.length} bölüm)</b></summary><div style="margin-top:10px">${mk.map(item).join('')}</div></details>`:'')})()}
   ${false?`<h3 class="sec">Kaynak ders notları</h3>${dp.map(p=>`<button class="subj" style="margin-bottom:8px" data-go='["okuma","${p.pid}"]'><h3>${esc(p.title)}</h3><div class="mut">${p.count} sayfa${S.marks['read_'+p.pid]?' · kaldığın yer: '+(S.marks['read_'+p.pid]+1)+'. sayfa':''}</div></button>`).join('')}`:''}
   ${n?`<h3 class="sec">Soru çöz</h3><div class="row" style="margin-bottom:10px"><button class="btn" data-go='["oturum",{"mode":"yeni","sub":"${sub}"}]'>${S.set.per} yeni soru</button><button class="btn alt" data-go='["oturum",{"mode":"karisik","sub":"${sub}"}]'>Karışık</button>${st.due?`<button class="btn alt" data-go='["oturum",{"mode":"due","sub":"${sub}"}]'>Yanlışlarım (${st.due})</button>`:''}</div>
   ${qp.map(p=>{let seen=0;for(const k in S.ans)if(k.startsWith(p.pid.slice(2)+'-'))seen++;return`<button class="subj" style="margin-bottom:8px" data-go='["oturum",{"mode":"kaynak","pid":"${p.pid}"}]'><h3>${esc(p.title)}</h3><div class="mut">${p.count} soru · ${seen} çözüldü</div><div class="bar"><i style="width:${pct(seen,p.count)}%"></i></div></button>`}).join('')}`:'<div class="card mut">Bu dersin soru bankası hazırlanıyor.</div>'}`,{tab:'dersler'});
};

/* ---- Soru oturumu ---- */
let SES=null;
async function gatherQuestions(filter){
  const qp=await packsOf('questions'); const out=[];
  for(const p of qp){if(filter.pid&&p.pid!==filter.pid)continue;if(filter.sub&&p.subject!==filter.sub&&!(filter.mode==='due'))continue;if(p.subject==='deneme'&&!filter.pid&&filter.mode!=='due')continue;
    const pk=await loadPack(p.pid); for(const q of pk.questions)out.push(Object.assign({pid:p.pid},q))}
  return out;
}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
VIEWS.oturum=async(f)=>{
  shell('Hazırlanıyor',`<div class="card"><span class="spin"></span> Sorular açılıyor…</div>`);
  let qs=await gatherQuestions(f);
  if(f.mode==='due'){qs=qs.filter(q=>isDue(S.ans[q.id])&&(!f.sub||q.sub===f.sub))}
  else if(f.mode==='yeni'){qs=qs.filter(q=>!S.ans[q.id]);qs=qs.slice(0,S.set.per)}
  else if(f.mode==='karisik'){qs=shuffle(qs).slice(0,S.set.per)}
  else if(f.mode==='kaynak'){const done=qs.filter(q=>S.ans[q.id]);const rest=qs.filter(q=>!S.ans[q.id]);qs=rest.length?rest:done}
  if(!qs.length){shell('Soru kalmadı','<div class="card">Bu seçimde çözülecek soru yok. 🎉</div>');return}
  SES={qs,i:0,f,picked:{},title:f.mode==='due'?'Tekrar':(f.pid?(await getManifest()).packs[f.pid].title:SUBJ_AD[f.sub]||'Sorular')};
  showQ();
};
async function showQ(){
  const s=SES,q=s.qs[s.i]; const pk=await loadPack(q.pid);
  const answered=s.picked[q.id];
  shell(`${s.title} · ${s.i+1}/${s.qs.length}`,`
   <div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="pill">${esc(SUBJ_AD[q.sub]||'Deneme')} · ${esc(pk.title)} · s.${q.page}</span>${S.marks[q.id]?'<span class="pill">⭐ işaretli</span>':''}</div>
   <div class="qwrap" id="qw"><img id="qimg" src="${pk.url(q.img)}" alt="Soru ${q.n}"><canvas id="ink"></canvas></div>
   ${inkTools()}
   ${q.complete===false?'<p class="mut" style="font-size:13px">Not: Bu soru kaynakta iki sütuna ya da sayfaya bölünmüş olabilir; şıklardan biri eksik görünürse kaynaktaki sayfaya bakabilirsin.</p>':''}
   <div class="opts">${'ABCDE'.split('').map(c=>`<button data-opt="${c}" class="${answered?(c===q.ans?'ok':(c===answered?'bad':'')):''}">${c}</button>`).join('')}</div>
   <div id="after">${answered?afterHtml(q,answered):''}</div>
   <div class="row" style="justify-content:space-between;margin-top:10px">
     <button class="btn alt small" id="prev" ${s.i?'':'disabled'}>‹ Önceki</button>
     <button class="btn alt small" id="mark">${S.marks[q.id]?'⭐ İşareti kaldır':'☆ İşaretle'}</button>
     <button class="btn small" id="next">${s.i+1<s.qs.length?'Sonraki ›':'Bitir'}</button>
   </div>`,{tab:'dersler'});
  initInk(q.id);
  app.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{
    if(s.picked[q.id])return; const c=b.dataset.opt; s.picked[q.id]=c; const ok=record(q,c);
    app.querySelectorAll('[data-opt]').forEach(x=>{if(x.dataset.opt===q.ans)x.classList.add('ok');else if(x.dataset.opt===c)x.classList.add('bad')});
    $('#after').innerHTML=afterHtml(q,c); bindAfter(q,c);
  });
  if(answered)bindAfter(q,answered);
  $('#prev').onclick=()=>{s.i--;showQ()};
  $('#next').onclick=()=>{if(s.i+1<s.qs.length){s.i++;showQ()}else finishSession()};
  $('#mark').onclick=()=>{S.marks[q.id]=!S.marks[q.id];save();showQ()};
}
function afterHtml(q,c){const ok=c===q.ans;return`<div class="verdict ${ok?'ok':'bad'}">${ok?'Doğru!':'Doğru cevap: '+q.ans}</div><div class="row"><button class="btn small" id="ask">💬 Sor</button><span class="mut" style="font-size:13px">${ok?'Emin değilsen yine sor; tahminle bilmek de öğrenmenin parçası.':'Neden '+q.ans+' olduğunu sorup konuyu oturtalım.'}</span></div>`}
function bindAfter(q,c){const b=$('#ask');if(b)b.onclick=()=>askSheet(q,c)}
function finishSession(){
  const s=SES;let n=0,ok=0;for(const q of s.qs){const c=s.picked[q.id];if(c){n++;if(c===q.ans)ok++}}
  shell('Set bitti',`<div class="card"><div class="stat"><div><b>${n}</b><span class="mut">cevaplanan</span></div><div><b>${ok}</b><span class="mut">doğru</span></div><div><b>${pct(ok,n)}%</b><span class="mut">başarı</span></div></div></div>
  <p class="mut">Yanlışların ${BOX_DAYS[0]} gün sonra Tekrar sekmesinde karşına çıkacak. Doğru bildiklerin de aralıkları açılarak arada bir yoklanır.</p>
  <div class="row"><button class="btn" data-go='${JSON.stringify(["oturum",s.f])}'>Bir set daha</button><button class="btn alt" data-tab="bugun">Bugün</button></div>`);
}

/* ---- Ders içi sor ve dinle ---- */
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\s+/g,' ').slice(0,400));u.lang='en-GB';u.rate=0.9;const v=speechSynthesis.getVoices().find(v=>/^en[-_](GB|US)/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){toast('Bu cihazda sesli okuma yok')}}
const ASK_HEAD='SMMM Staja Giriş Sınavına (SGS) hazırlanıyorum, sıfırdan başladım ve otelde çalışıyorum. Benimle karşılıklı konuşarak çalış (sesli modda da konuşabilirim): her seferinde kısa anlat, tek bir şeyi açıkla, sonra anladım mı diye sor ve cevabımı bekle. "Örnek oturmadı" dersem aynı şeyi bambaşka bir örnekle anlat; otel, günlük hayat, para gibi farklı alanlardan örnek dene. Uzun listeler yerine sohbet et.';
async function clipCopy(t){if(window.SGSAndroid){SGSAndroid.copy(t);return true}try{await navigator.clipboard.writeText(t);return true}catch(e){return false}}
async function openClaude(t){await clipCopy(t);const u='https://claude.ai/new?q='+encodeURIComponent(t.slice(0,6000));if(window.SGSAndroid)SGSAndroid.open(u);else window.open(u,'_blank')}
function takilAdd(it){S.takil=S.takil||[];const k=it.pid+'|'+(it.sec||'')+'|'+(it.q||'').slice(0,80);const ex=S.takil.find(x=>x.k===k);if(ex){ex.t=Date.now();ex.n=(ex.n||1)+1;if(it.note)ex.note=it.note}else S.takil.unshift(Object.assign({k,t:Date.now(),n:1},it));save()}
function takilPrompt(it){const isQ=!!it.q;return `${ASK_HEAD}\n\nDers: ${it.ders} · ${it.title}${it.sec?`\nBölüm: ${it.sec}`:''}\n\n${isQ?`Takıldığım soru:\n${it.q}\n`:`Takıldığım kısım:\n${(it.text||'').slice(0,2500)}\n`}\n${it.note?`Özellikle şunu anlamadım: ${it.note}\n\n`:''}${isQ?'Bu soruyu adım adım çöz, doğru cevabın neden doğru, diğer şıkların neden yanlış olduğunu açıkla. Sonra konuyu bir örnekle pekiştir ve bana benzer 2 soru sor; cevaplarımı bekle.':'Bu kısmı daha ayrıntılı anlat: önce basit bir benzetme, sonra kural, sonra rakamlı bir örnek. Sonunda anlayıp anlamadığımı görmek için bana 2-3 soru sor ve cevaplarımı bekle.'}`}
function lessonAsk(pk,sel,ctx={}){
  const it={pid:pk.pid,ders:SUBJ_AD[pk.subject]||'',title:pk.title,sec:ctx.sec||'',text:ctx.text||sel||'',q:ctx.q||''};
  const d=document.createElement('div');d.className='sheet';
  const prev=(it.q||it.text||'').replace(/</g,'&lt;').slice(0,300);
  d.innerHTML=`<div class="card"><h3 style="margin:0 0 8px">${ctx.sec||ctx.q?'🤔 Anlamadım':'Bana sor'}</h3><p class="mut" style="margin:0 0 8px">${it.sec?'<b>'+esc(it.sec)+'</b> · ':''}Ders${it.q?', soru ve cevabı':it.text?' ve ilgili metin':''} otomatik eklenecek. İstersen neyi anlamadığını yaz.</p>${prev?`<p style="font-size:14px;margin:0 0 8px;max-height:110px;overflow:auto"><i>“${prev}${(it.q||it.text).length>300?'…':''}”</i></p>`:''}
  <textarea id="askt" rows="3" placeholder="Örn: Neden C değil de B? / Otelden bir örnekle anlatır mısın?"></textarea>
  <div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn" id="go">Claude'da aç</button><button class="btn alt" id="sv">📌 Listeme ekle</button><button class="btn alt" id="cp">Kopyala</button><button class="btn alt" id="x">Kapat</button></div>
  <p class="mut" style="font-size:12px;margin:8px 0 0">Claude'da açtığın konular da "Takıldıklarım" listesine düşer.</p></div>`;
  document.body.appendChild(d);
  const fin=()=>{it.note=$('#askt',d).value.trim();takilAdd(it);return takilPrompt(it)};
  $('#go',d).onclick=async()=>{const t=fin();await openClaude(t);d.remove()};
  $('#sv',d).onclick=()=>{fin();toast('Takıldıklarım listesine eklendi');d.remove()};
  $('#cp',d).onclick=async()=>{toast(await clipCopy(fin())?'Kopyalandı, Claude\'a yapıştırabilirsin':'Kopyalanamadı');d.remove()};
  $('#x',d).onclick=()=>d.remove(); d.onclick=e=>{if(e.target===d)d.remove()};
}
function bindAnlamadim(pk){
  const art=$('article.lesson'); if(!art)return;
  art.querySelectorAll('h3').forEach(h=>{
    if(h.closest('.cqq,.kutu'))return;
    const sec=h.textContent.trim();
    const b=document.createElement('button');b.className='anl';b.type='button';b.textContent='🤔 Anlamadım';
    b.onclick=e=>{e.stopPropagation();let t='',n=h.nextElementSibling;
      while(n&&n.tagName!=='H3'){if(!(n.matches&&n.matches('details.cq')))t+=n.innerText.trim()+'\n';n=n.nextElementSibling}
      lessonAsk(pk,'',{sec,text:t.trim().slice(0,2500)})};
    h.appendChild(b)});
  art.querySelectorAll('.cqq').forEach(q=>{
    let secH=q.closest('details.cq');while(secH&&secH.tagName!=='H3')secH=secH.previousElementSibling;
    const b=document.createElement('button');b.className='anl';b.type='button';b.textContent='🤔 Anlamadım, anlat';
    b.onclick=e=>{e.stopPropagation();const stem=(q.querySelector('.cqs')||{}).textContent||'';const opts=[...q.querySelectorAll('.cqo li')].map(li=>li.textContent.trim()).join('\n')||((q.querySelector('.cqo')||{}).textContent||'');const ans=[...q.querySelectorAll('.cqa p')].map(p=>p.textContent.trim()).join('\n');lessonAsk(pk,'',{sec:secH?secH.firstChild.textContent.trim():'',q:`${stem.trim()}\n${opts}\nCevap anahtarı: ${ans||'yok'}`})};
    q.appendChild(b)});
}
VIEWS.takil=async()=>{
  const L=S.takil||[];
  const it=x=>`<div class="card" style="margin-bottom:10px"><div class="mut" style="font-size:12px">${new Date(x.t).toLocaleDateString('tr-TR')} · ${esc(x.ders)}${x.n>1?' · '+x.n+'. kez':''}</div><b>${esc(x.title)}</b>${x.sec?`<div>${esc(x.sec)}</div>`:''}<p class="mut" style="font-size:14px;margin:6px 0;max-height:72px;overflow:hidden">${esc((x.q||x.text||'').slice(0,220))}</p>${x.note?`<p style="font-size:14px;margin:0 0 6px">💭 ${esc(x.note)}</p>`:''}
    <div class="row"><button class="btn small" data-ta="sor" data-k="${esc(x.k)}">Claude'a sor</button><button class="btn alt small" data-go='["okuma","${x.pid}"]'>Derse git</button><button class="btn alt small" data-ta="ok" data-k="${esc(x.k)}">✔ Anladım</button></div></div>`;
  shell('Takıldıklarım',`<p class="mut">Ders içinde "🤔 Anlamadım" dediğin yerler burada birikir. Anladıklarını işaretle, kalanları istediğinde topluca Claude'a götür.</p>
   ${L.length?`<div class="row" style="margin-bottom:12px;flex-wrap:wrap"><button class="btn" id="tall">Hepsini Claude'da anlat</button><button class="btn alt" id="tder">Derslere eklensin diye kopyala</button></div>${L.map(it).join('')}`:'<div class="card">Liste boş. Bir derste başlığın yanındaki ya da sorunun altındaki <b>🤔 Anlamadım</b> butonuna bas.</div>'}
   ${S.takilOk?`<p class="mut">Anladığın konu sayısı: ${S.takilOk}</p>`:''}`,{tab:'dersler'});
  app.querySelectorAll('[data-ta]').forEach(b=>b.onclick=async()=>{const x=S.takil.find(y=>y.k===b.dataset.k);if(!x)return;
    if(b.dataset.ta==='sor'){await openClaude(takilPrompt(x))}else{S.takil=S.takil.filter(y=>y!==x);S.takilOk=(S.takilOk||0)+1;save();toast('Harika, listeden çıktı');VIEWS.takil()}});
  const lst=()=>L.map((x,i)=>`${i+1}) ${x.ders} · ${x.title}${x.sec?' · '+x.sec:''}${x.note?'\n   Notum: '+x.note:''}\n   ${(x.q||x.text||'').replace(/\s+/g,' ').slice(0,400)}`).join('\n\n');
  const a=$('#tall');if(a)a.onclick=()=>openClaude(`${ASK_HEAD}\n\nAşağıdaki konularda takıldım. Sırayla, her birini ayrı başlık altında anlat; her birinde bir benzetme, bir rakamlı örnek ve bir kontrol sorusu olsun. Bir konuyu bitirince benim cevabımı bekle, sonra diğerine geç.\n\n${lst()}`);
  const c=$('#tder');if(c)c.onclick=async()=>toast(await clipCopy(`SGS uygulamamdaki "Takıldıklarım" listesi. Bu konuları derslerde daha ayrıntılı anlat, örnek ve soru ekle:\n\n${lst()}`)?'Kopyalandı. Bu listeyi uygulama sohbetimize yapıştır':'Kopyalanamadı');
};
/* ---- Sor (Claude) ---- */
function askSheet(q,c){
  const d=document.createElement('div');d.className='sheet';
  d.innerHTML=`<div class="card"><h3 style="margin:0 0 8px">Bana sor</h3><p class="mut" style="margin:0 0 8px">Sorunun metni, doğru cevap ve senin cevabın otomatik eklenecek. Sen sadece neyi anlamadığını yaz.</p>
  <textarea id="askt" rows="3" placeholder="Örn: B şıkkı neden yanlış? Bu kaydı hiç anlamadım, baştan anlatır mısın?"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn" id="go">Claude'da aç</button><button class="btn alt" id="cp">Sadece kopyala</button><button class="btn alt" id="x">Kapat</button></div></div>`;
  document.body.appendChild(d);
  const prompt=()=>`SMMM Staja Giriş Sınavına (SGS) hazırlanıyorum, muhasebede sıfırdan başladım. Bana arkadaşımla çalışıyormuşum gibi, sade ve örnekli anlat; mümkünse otel işletmesinden örnek ver.\n\nDers: ${SUBJ_AD[q.sub]||'Deneme'}\nKaynak: ${PACKS[q.pid]?.title||''}, sayfa ${q.page}\n\nSoru (kaynak metni, tablo/kayıtlar bozuk görünebilir):\n${q.text}\n\nCevap anahtarı: ${q.ans}\nBenim cevabım: ${c}\n\nSorum: ${$('#askt').value.trim()||'Doğru cevabın neden doğru, diğer şıkların neden yanlış olduğunu açıklar mısın?'}`;
  const copy=async t=>{if(window.SGSAndroid){SGSAndroid.copy(t);return true}try{await navigator.clipboard.writeText(t);return true}catch(e){return false}};
  $('#go',d).onclick=async()=>{const t=prompt();await copy(t);const u='https://claude.ai/new?q='+encodeURIComponent(t.slice(0,6000));if(window.SGSAndroid)SGSAndroid.open(u);else window.open(u,'_blank');d.remove()};
  $('#cp',d).onclick=async()=>{toast(await copy(prompt())?'Kopyalandı, Claude\'a yapıştırabilirsin':'Kopyalanamadı');d.remove()};
  $('#x',d).onclick=()=>d.remove(); d.onclick=e=>{if(e.target===d)d.remove()};
}

/* ---- Kalem ---- */
let INK={tool:'pen',color:'#d62828',size:3,on:false};
function inkTools(){return`<div class="tools"><button id="t-on" class="${INK.on?'on':''}">✏️ Kalem ${INK.on?'açık':'kapalı'}</button>${INK.on?`<button data-tool="pen" class="${INK.tool==='pen'?'on':''}">Kalem</button><button data-tool="hl" class="${INK.tool==='hl'?'on':''}">Fosforlu</button><button data-tool="er" class="${INK.tool==='er'?'on':''}">Silgi</button>${['#d62828','#1d4ed8','#111827','#15803d'].map(c=>`<button class="dot" data-color="${c}" style="background:${c};${INK.color===c?'outline:3px solid var(--acc)':''}"></button>`).join('')}<button id="t-clr">Temizle</button>`:''}</div>`}
function initInk(key){
  const wrap=$('#qw')||$('.page-wrap'); const cv=$('#ink'); const img=$('#qimg'); if(!cv)return;
  const fit=async()=>{const r=wrap.getBoundingClientRect();const dpr=devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;const ctx=cv.getContext('2d');const saved=await idb.get('ink',key);if(saved){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,cv.width,cv.height);im.src=saved}};
  if(img.complete)fit();else img.onload=fit;
  wrap.classList.toggle('draw',INK.on);
  const tb=$('.tools');
  tb.querySelector('#t-on').onclick=()=>{INK.on=!INK.on;tb.outerHTML=inkTools();initInk(key)};
  tb.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{INK.tool=b.dataset.tool;$('.tools').outerHTML=inkTools();initInkTools(key)});
  tb.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{INK.color=b.dataset.color;INK.tool=INK.tool==='er'?'pen':INK.tool;$('.tools').outerHTML=inkTools();initInkTools(key)});
  const clr=tb.querySelector('#t-clr'); if(clr)clr.onclick=()=>{cv.getContext('2d').clearRect(0,0,cv.width,cv.height);idb.del('ink',key)};
  let drawing=false,last=null,saveT2;
  cv.onpointerdown=e=>{if(!INK.on)return;if(S.set.pen==='pen'&&e.pointerType==='touch')return;drawing=true;last=pt(e);cv.setPointerCapture(e.pointerId);e.preventDefault()};
  cv.onpointermove=e=>{if(!drawing)return;const p=pt(e);const ctx=cv.getContext('2d');const dpr=devicePixelRatio||1;ctx.lineCap='round';ctx.lineJoin='round';
    if(INK.tool==='er'){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=22*dpr}else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=INK.tool==='hl'?INK.color+'55':INK.color;ctx.lineWidth=(INK.tool==='hl'?16:INK.size*(e.pressure>0&&e.pointerType==='pen'?0.5+e.pressure:1))*dpr}
    ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p};
  cv.onpointerup=cv.onpointercancel=()=>{if(!drawing)return;drawing=false;clearTimeout(saveT2);saveT2=setTimeout(()=>idb.set('ink',key,cv.toDataURL('image/png')),300)};
  function pt(e){const r=cv.getBoundingClientRect();const dpr=devicePixelRatio||1;return{x:(e.clientX-r.left)*dpr,y:(e.clientY-r.top)*dpr}}
}
function initInkTools(key){initInk(key)}

  shell('Açılıyor',`<div class="card"><span class="spin"></span> Sayfalar açılıyor…</div>`,{tab:'dersler'});

    const ing=pk.subject==='ing';
    shell(pk.title,`<div class="row" style="margin-bottom:8px"><button class="btn small" id="lask">💬 Bu dersle ilgili sor</button><button class="btn alt small" data-go='["takil"]'>🤔 Takıldıklarım${(S.takil||[]).length?' ('+S.takil.length+')':''}</button>${ing&&window.speechSynthesis?'<button class="btn alt small" id="lsay">🔊 Seçtiğimi dinle</button><span class="mut" style="font-size:13px">İngilizce satıra dokun, okusun.</span>':'<span class="mut" style="font-size:13px">Bir cümleyi seçip sorarsan onu da eklerim.</span>'}</div><article class="card lesson">${td.decode(pk.raw(pk.html))}</article>${pk.tools?dersSonu(pk):''}`,{tab:pk.kind==='guide'?'hafiza':'dersler'});
    let lastSel='';const selH=()=>{const t=String(getSelection()).trim();if(t)lastSel=t};document.addEventListener('selectionchange',selH);
    $('#lask').onclick=()=>{lessonAsk(pk,String(getSelection()).trim()||lastSel);lastSel=''};
    if(ing&&window.speechSynthesis){
      $('#lsay').onclick=()=>{const t=String(getSelection()).trim()||lastSel;t?say(t):toast('Önce bir cümle seç')};
      document.querySelectorAll('article.lesson tr').forEach(tr=>{const c=tr.querySelector('td');if(!c||!/[a-z]/i.test(c.textContent)||/[çğıöşüÇĞİÖŞÜ]/.test(c.textContent))return;c.style.cursor='pointer';c.title='Dinle';c.onclick=()=>say(c.textContent)});
    }
    bindAnlamadim(pk);if(pk.tools)bindDersSonu(pk);return}
  let i=startPage??(S.marks['read_'+pid]||0);
  const show=()=>{S.marks['read_'+pid]=i;save();
    shell(`${pk.title} · ${i+1}/${pk.pages.length}`,`<div class="qwrap page-wrap" id="qw"><img id="qimg" src="${pk.url(pk.pages[i])}" alt="Sayfa ${i+1}"><canvas id="ink"></canvas></div>${inkTools()}
    <div class="row" style="justify-content:space-between;margin-top:10px"><button class="btn alt small" id="pp" ${i?'':'disabled'}>‹ Önceki</button><button class="btn alt small" id="pg">Sayfaya git</button><button class="btn small" id="pn" ${i+1<pk.pages.length?'':'disabled'}>Sonraki ›</button></div>`,{tab:'dersler'});
    initInk(pid+':'+i);
    $('#pp').onclick=()=>{i--;show()};$('#pn').onclick=()=>{i++;show()};
    $('#pg').onclick=()=>{const n=parseInt(prompt('Sayfa numarası (1-'+pk.pages.length+')'),10);if(n>=1&&n<=pk.pages.length){i=n-1;show()}};
  };show();
};

VIEWS.deneme=async()=>{
  const dp=(await packsOf('questions','deneme'));
  let h='<p class="mut">Gerçek sınav düzeninde 130 soru: 1–20 genel kültür, 21–30 yabancı dil, 31–130 alan bilgisi. Süre tutulmaz; istediğin zaman ara verip kaldığın yerden devam edebilirsin. Yanlışlar puanı düşürmez, boş bırakma.</p>';
  for(const p of dp){const pk=await loadPack(p.pid);const groups=[...new Set(pk.questions.map(q=>q.group))];
    groups.forEach((g,k)=>{const id=p.pid+'#'+g;const r=S.denemeler[id];const cnt=pk.questions.filter(q=>q.group===g).length;
      h+=`<button class="subj" style="margin-bottom:8px" data-go='["denemeOturum","${p.pid}",${g}]'><h3>Deneme ${k+1}</h3><div class="mut">${cnt} soru · ${r?(r.done?`Bitti: ${r.ok} doğru (${pct(r.ok,cnt)}%)`:`Devam ediyor: ${Object.keys(r.a||{}).length} cevap`):'Başlanmadı'}</div></button>`})}
  const md=await packsOf('doc','deneme');
  if(md.length)h+=`<h3 class="sec">Mali Kampüs denemeleri (kâğıt üzerinde çöz)</h3><p class="mut">Bunlar sayfa olarak açılır; kalemle işaretleyerek çözebilirsin.</p>`+md.map(p=>`<button class="subj" style="margin-bottom:8px" data-go='["okuma","${p.pid}"]'><h3>${esc(p.title)}</h3><div class="mut">${p.count} sayfa</div></button>`).join('');
  shell('Deneme sınavları',h,{back:false,tab:'deneme'});
};
VIEWS.denemeOturum=async(pid,g)=>{
  const pk=await loadPack(pid); const qs=pk.questions.filter(q=>q.group===g).map(q=>Object.assign({pid},q));
  const id=pid+'#'+g; const R=S.denemeler[id]||(S.denemeler[id]={a:{},i:0,done:false});
  const secAd={gk:'Genel kültür',ing:'Yabancı dil',alan:'Alan bilgisi'};
  const draw=()=>{
    if(R.done)return result();
    const q=qs[R.i];
    shell(`Deneme · ${R.i+1}/${qs.length}`,`<span class="pill">${secAd[q.sec]||''} · soru ${q.n}</span>
     <div class="qwrap" id="qw" style="margin-top:6px"><img id="qimg" src="${pk.url(q.img)}"><canvas id="ink"></canvas></div>${inkTools()}
     <div class="opts">${'ABCDE'.split('').map(c=>`<button data-opt="${c}" class="${R.a[q.id]===c?'sel':''}">${c}</button>`).join('')}</div>
     <div class="row" style="justify-content:space-between"><button class="btn alt small" id="prev" ${R.i?'':'disabled'}>‹</button><button class="btn alt small" id="map">Soru haritası</button><button class="btn small" id="next">${R.i+1<qs.length?'›':'Bitir'}</button></div>
     <div id="qmap"></div>`,{tab:'deneme'});
    initInk('d:'+q.id);
    app.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{R.a[q.id]=R.a[q.id]===b.dataset.opt?undefined:b.dataset.opt;save();app.querySelectorAll('[data-opt]').forEach(x=>x.classList.toggle('sel',x.dataset.opt===R.a[q.id]))});
    $('#prev').onclick=()=>{R.i--;save();draw()};
    $('#next').onclick=()=>{if(R.i+1<qs.length){R.i++;save();draw()}else if(confirm('Denemeyi bitirip sonuçları görelim mi?')){R.done=true;let ok=0;for(const q of qs){const c=R.a[q.id];if(c){record(q,c);if(c===q.ans)ok++}}R.ok=ok;save();result()}};
    $('#map').onclick=()=>{$('#qmap').innerHTML=`<div class="qnav">${qs.map((x,k)=>`<button class="${R.a[x.id]?'a':''} ${k===R.i?'cur':''}" data-k="${k}">${x.n}</button>`).join('')}</div>`;$('#qmap').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{R.i=+b.dataset.k;save();draw()})};
  };
  const result=()=>{
    const by={};for(const q of qs){const s=q.sec||'alan';const b=by[s]||(by[s]={n:0,ok:0,bos:0});b.n++;const c=R.a[q.id];if(!c)b.bos++;else if(c===q.ans)b.ok++}
    shell('Deneme sonucu',`<div class="card"><table class="res"><tr><th>Bölüm</th><th>Doğru</th><th>Yanlış</th><th>Boş</th></tr>${Object.entries(by).map(([k,b])=>`<tr><td>${secAd[k]}</td><td>${b.ok}/${b.n}</td><td>${b.n-b.ok-b.bos}</td><td>${b.bos}</td></tr>`).join('')}</table></div>
    <p class="mut">SGS'de puan diğer adaylara göre hesaplanır (bağıl değerlendirme). Bu yüzden kesin puan veremem; asıl önemli olan, denemeden denemeye doğru sayının artması.</p>
    <div class="qnav">${qs.map((x,k)=>{const c=R.a[x.id];return`<button class="${c?(c===x.ans?'ok':'bad'):''}" data-k="${k}">${x.n}</button>`}).join('')}</div>
    <div class="row" style="margin-top:12px"><button class="btn alt" id="again">Denemeyi sıfırla</button></div>`,{tab:'deneme'});
    app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{SES={qs,i:+b.dataset.k,f:{mode:'kaynak',pid},picked:Object.fromEntries(qs.map(q=>[q.id,R.a[q.id]||'-'])),title:'Deneme incelemesi'};showQ()});
    $('#again').onclick=()=>{if(confirm('Bu denemedeki cevaplar silinsin mi?')){delete S.denemeler[id];save();VIEWS.denemeOturum(pid,g)}};
  };
  draw();
};


/* ====== Hafıza Atölyesi ====== */
const CARD_DAYS=[1,3,7,14,30,60];
const DINLET=[1,7,14,30];
async function lessonPacks(){const m=await getManifest();return Object.entries(m.packs).filter(([k,v])=>v.kind==='lesson').map(([k,v])=>Object.assign({pid:k},v))}
async function toolPacks(){const m=await getManifest();return Object.entries(m.packs).filter(([k,v])=>v.kind==='lesson'||v.kind==='tools').map(([k,v])=>Object.assign({pid:k},v))}
function cardsOf(pk){return (pk.tools&&pk.tools.kartlar||[]).map((c,i)=>Object.assign({id:pk.pid+':'+i,sub:pk.subject,src:pk.title},c))}
async function allCards(onlyDone=true){const out=[];for(const p of await lessonPacks()){if(onlyDone&&!S.done[p.pid])continue;const pk=await loadPack(p.pid);out.push(...cardsOf(pk))}return out}
const cardDue=c=>{const st=S.cards[c.id];return !st||st.due<=today()};
function dinletDue(){const out=[];for(const[pid,d]of Object.entries(S.done)){const dn=S.dinlet[pid]||[];for(const o of DINLET){if(dn.includes(o))continue;if(d+o*DAY<=today()){out.push({pid,o});break}}}return out}
function dersSonu(pk){
  const t=pk.tools;const done=S.done[pk.pid];
  let h=`<div class="card"><h2 style="margin:0 0 6px">Ders sonu</h2><p class="mut" style="margin:0 0 10px">Okuduğunu kalıcı yapmak için sırayla: kod, fark tablosu, saray turu, kartlar ve son olarak anlat.</p>
  ${done?`<div class="pill">✓ ${new Date(done).toLocaleDateString('tr-TR')} tarihinde bitirildi · anlatarak tekrar 1, 7, 14 ve 30. günde</div>`:`<button class="btn" id="dbitir">Dersi bitirdim: kartları ve tekrarları başlat</button>`}</div>`;
  if(t.kodlar&&t.kodlar.length)h+=`<h3 class="sec">🔑 Kodlar</h3>`+t.kodlar.map(kodHtml).join('');
  if(t.farklar&&t.farklar.length)h+=`<h3 class="sec">⚖️ Fark tabloları</h3>`+t.farklar.map(farkHtml).join('');
  if(t.saray)h+=`<h3 class="sec">🏨 Hafıza sarayı</h3><button class="subj" data-go='["saray","${pk.pid}"]'><h3>${esc(t.saray.ad)}</h3><div class="mut">${t.saray.duraklar.length} durak · rehberli tur ve yoklama${S.saray[pk.pid]!=null?' · son yoklama: '+S.saray[pk.pid]+'/'+t.saray.duraklar.length:''}</div></button>`;
  if(t.kartlar&&t.kartlar.length)h+=`<h3 class="sec">🃏 Kartlar</h3><button class="subj" data-go='["kartlar",{"pid":"${pk.pid}","hepsi":true}]'><h3>Bu dersin ${t.kartlar.length} kartını çalış</h3><div class="mut">Ders bitince kartlar aralıklı tekrar destene de eklenir.</div></button>`;
  if(t.feynman)h+=feynHtml(pk);
  return h;
}
function kodHtml(k){return`<details class="card" style="padding:12px 14px"><summary style="font-size:17px">${esc(k.kod)}</summary><p style="margin:8px 0 4px">${esc(k.acilim)}</p>${k.ipucu?`<p class="mut" style="margin:0">💡 ${esc(k.ipucu)}</p>`:''}</details>`}
function farkHtml(f,i){const id='f'+Math.random().toString(36).slice(2,7);return`<div class="card" style="padding:12px"><div class="row" style="justify-content:space-between"><b>${esc(f.baslik)}</b><button class="btn alt small" data-yokla="${id}">Kendini yokla</button></div>
  <div class="lesson"><table id="${id}"><tr><th></th>${f.kolonlar.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${f.satirlar.map(r=>`<tr><td><b>${esc(r[0])}</b></td>${r.slice(1).map(c=>`<td class="fc">${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div></div>`}
function bindFark(root=document){root.querySelectorAll('[data-yokla]').forEach(b=>b.onclick=()=>{const tb=document.getElementById(b.dataset.yokla);const on=!tb.classList.contains('gizli');tb.classList.toggle('gizli',on);b.textContent=on?'Hepsini göster':'Kendini yokla';tb.querySelectorAll('td.fc').forEach(td=>{td.classList.toggle('kapali',on);td.onclick=()=>td.classList.remove('kapali')})})}
function feynHtml(pk){const f=pk.tools.feynman;const last=(S.feyn[pk.pid]||[]).slice(-1)[0];return`<h3 class="sec">🗣️ Anlat (Feynman)</h3><div class="card"><p style="margin:0 0 8px"><b>Görev:</b> ${esc(f.gorev)}</p>
  <textarea id="fey" rows="6" placeholder="Kitaba bakmadan, kendi cümlelerinle yaz. Telefon klavyesindeki mikrofona basıp konuşarak da yazabilirsin.">${esc(last?last.text:'')}</textarea>
  <p class="mut" style="margin:10px 0 4px">Anlatımında bunlar var mı?</p>${f.kontrol.map((k,i)=>`<label style="display:block;margin:4px 0"><input type="checkbox" class="fk"> ${esc(k)}</label>`).join('')}
  <div class="row" style="margin-top:10px"><button class="btn" id="feyask">Claude kontrol etsin</button><button class="btn alt" id="feysave">Kaydet</button></div></div>`}
function bindDersSonu(pk){
  const b=$('#dbitir');if(b)b.onclick=()=>{S.done[pk.pid]=today();save();toast('Harika. Kartlar destene eklendi, yarın ilk tekrar var.');VIEWS.okuma(pk.pid)};
  bindFark();
  const fs=$('#feysave'),fa=$('#feyask');
  const store=()=>{const t=$('#fey').value.trim();if(!t)return false;(S.feyn[pk.pid]=S.feyn[pk.pid]||[]).push({t:Date.now(),text:t});
    const due=dinletDue().find(x=>x.pid===pk.pid);if(due){(S.dinlet[pk.pid]=S.dinlet[pk.pid]||[]).push(due.o)}save();return true};
  if(fs)fs.onclick=()=>{toast(store()?'Kaydedildi':'Önce bir şeyler yaz')};
  if(fa)fa.onclick=async()=>{const t=$('#fey').value.trim();if(!t){toast('Önce anlatımını yaz');return}store();
    const p=`SMMM Staja Giriş Sınavına hazırlanıyorum. Feynman tekniğiyle bir konuyu kendi cümlelerimle anlattım. Sen hocam gibi davran: önce doğru olanları kısaca söyle, sonra yanlış ya da eksik olanları tek tek göster ve düzelt, en sonunda aklımda kalması için 2-3 cümlelik toparlama yap. Sade anlat, otel işletmesinden örnek ver.\n\nKonu: ${pk.title}\nGörev: ${pk.tools.feynman.gorev}\n\nBenim anlatımım:\n${t}`;
    if(window.SGSAndroid){SGSAndroid.copy(p);SGSAndroid.open('https://claude.ai/new?q='+encodeURIComponent(p.slice(0,6000)))}else{try{await navigator.clipboard.writeText(p)}catch(e){}window.open('https://claude.ai/new?q='+encodeURIComponent(p.slice(0,6000)),'_blank')}};
}

/* ---- Kart oturumu ---- */
VIEWS.kartlar=async(f={})=>{
  shell('Kartlar',`<div class="card"><span class="spin"></span></div>`,{tab:'hafiza'});
  let cs;if(f.pid){cs=cardsOf(await loadPack(f.pid))}else cs=(await allCards()).filter(cardDue);
  if(!f.hepsi&&!f.pid)cs=shuffle(cs);
  if(!cs.length){shell('Kartlar','<div class="card">Bugün tekrar edilecek kart yok. 🎉 Yeni ders bitirdikçe kartlar buraya gelir.</div>',{tab:'hafiza'});return}
  let i=0,acik=false,stat={b:0,z:0,y:0};const q=[...cs];
  const draw=()=>{if(i>=q.length){shell('Kartlar bitti',`<div class="card"><div class="stat"><div><b>${stat.b}</b><span class="mut">bildim</span></div><div><b>${stat.z}</b><span class="mut">zorlandım</span></div><div><b>${stat.y}</b><span class="mut">bilemedim</span></div></div></div><p class="mut">Bilemediklerin yarın yine gelecek, bildiklerin giderek seyrekleşecek.</p><button class="btn" data-tab="hafiza">Hafıza'ya dön</button>`,{tab:'hafiza'});return}
    const c=q[i];shell(`Kart ${i+1}/${q.length}`,`<div class="pill">${esc(SUBJ_AD[c.sub]||'')} · ${esc(c.src)}</div>
    <div class="card" style="margin-top:8px;min-height:180px;display:flex;flex-direction:column;justify-content:center;text-align:center"><div style="font-size:19px;font-weight:600">${esc(c.s)}</div>${acik?`<hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><div style="font-size:17px">${esc(c.c)}</div>`:''}</div>
    ${acik?`<div class="opts" style="grid-template-columns:repeat(3,1fr)"><button data-r="y" style="font-size:15px">Bilemedim</button><button data-r="z" style="font-size:15px">Zorlandım</button><button data-r="b" style="font-size:15px">Bildim</button></div>`:`<button class="btn" id="goster" style="width:100%">Cevabı göster</button><p class="mut" style="text-align:center">Önce kafanda ya da sesli cevapla, sonra bak.</p>`}`,{tab:'hafiza'});
    if(!acik){$('#goster').onclick=()=>{acik=true;draw()};return}
    app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const r=b.dataset.r;const st=S.cards[c.id]||(S.cards[c.id]={box:0,due:0,n:0});st.n++;
      if(r==='b'){stat.b++;st.box=Math.min(st.box+1,CARD_DAYS.length-1);st.due=today()+CARD_DAYS[st.box]*DAY}
      else if(r==='z'){stat.z++;st.due=today()+DAY}
      else{stat.y++;st.box=0;st.due=today()+DAY;q.push(c)}
      save();i++;acik=false;draw()});
  };draw();
};

/* ---- Hafıza sarayı turu ---- */
VIEWS.saray=async(pid)=>{
  const pk=await loadPack(pid);const sr=pk.tools.saray;const D=sr.duraklar;let i=-1,mode='tur',goster=false,puan=0;
  const draw=()=>{
    if(mode==='tur'){
      if(i<0){shell(sr.ad,`<div class="card"><p style="margin-top:0">${esc(sr.giris)}</p><button class="btn" id="n">Tura başla</button></div>`,{tab:'hafiza'});$('#n').onclick=()=>{i=0;draw()};return}
      if(i>=D.length){shell(sr.ad,`<div class="card"><h3 style="margin-top:0">Tur bitti</h3><p>Şimdi yoklama: sana sadece yeri söyleyeceğim, orada ne olduğunu sen hatırlayacaksın.</p><button class="btn" id="n">Yoklamaya geç</button> <button class="btn alt" id="r">Turu tekrarla</button></div>`,{tab:'hafiza'});$('#n').onclick=()=>{mode='yokla';i=0;puan=0;goster=false;draw()};$('#r').onclick=()=>{i=0;draw()};return}
      const d=D[i];shell(`${sr.ad} · ${i+1}/${D.length}`,`<div class="card"><div class="mut">Durak ${i+1}</div><h2 style="margin:4px 0 10px">📍 ${esc(d.yer)}</h2><p style="font-size:17px">🎬 ${esc(d.imge)}</p>${goster?`<div class="lesson"><div class="kutu"><b class="bas">Bilgi</b>${esc(d.bilgi)}</div></div>`:''}</div>
      ${goster?`<button class="btn" id="n" style="width:100%">Sonraki durak ›</button>`:`<p class="mut">Sahneyi gözünün önüne getir. Hazır olunca bilgiyi aç.</p><button class="btn" id="b" style="width:100%">Bilgiyi göster</button>`}`,{tab:'hafiza'});
      if(goster)$('#n').onclick=()=>{i++;goster=false;draw()};else $('#b').onclick=()=>{goster=true;draw()};return}
    if(i>=D.length){S.saray[pid]=puan;save();shell('Yoklama sonucu',`<div class="card"><div class="stat"><div><b>${puan}/${D.length}</b><span class="mut">hatırlanan</span></div></div></div><p class="mut">Yarın bir daha yokla. Kalıcı öğrenme için ertesi gün, bir hafta, iki hafta ve bir ay sonra yeniden yoklamak en iyisidir.</p><button class="btn" data-tab="hafiza">Hafıza'ya dön</button>`,{tab:'hafiza'});return}
    const d=D[i];shell(`Yoklama ${i+1}/${D.length}`,`<div class="card"><h2 style="margin:0 0 8px">📍 ${esc(d.yer)}</h2><p class="mut">Burada hangi sahne vardı, hangi bilgiyi taşıyordu?</p>${goster?`<p>🎬 ${esc(d.imge)}</p><div class="lesson"><div class="kutu">${esc(d.bilgi)}</div></div>`:''}</div>
    ${goster?`<div class="opts" style="grid-template-columns:1fr 1fr"><button data-k="0" style="font-size:15px">Hatırlamadım</button><button data-k="1" style="font-size:15px">Hatırladım</button></div>`:`<button class="btn" id="b" style="width:100%">Cevabı göster</button>`}`,{tab:'hafiza'});
    if(goster)app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{puan+=+b.dataset.k;i++;goster=false;draw()});else $('#b').onclick=()=>{goster=true;draw()};
  };draw();
};

/* ---- Hafıza sekmesi ---- */
VIEWS.hafiza=async()=>{
  shell('Hafıza',`<div class="card"><span class="spin"></span></div>`,{back:false,tab:'hafiza'});
  const cards=await allCards();const dueC=cards.filter(cardDue).length;const din=dinletDue();
  const dueQ=Object.values(S.ans).filter(isDue).length;
  const tp=await toolPacks();let kod=0,fark=0,saray=[];for(const p of tp){const pk=await loadPack(p.pid);const t=pk.tools||{};kod+=(t.kodlar||[]).length;fark+=(t.farklar||[]).length;if(t.saray)saray.push(pk)}
  const m=await getManifest();const guide=Object.entries(m.packs).find(([k,v])=>v.kind==='guide');
  shell('Hafıza',`
  <div class="card"><div class="stat"><div><b>${dueC}</b><span class="mut">kart</span></div><div><b>${din.length}</b><span class="mut">anlatarak tekrar</span></div><div><b>${dueQ}</b><span class="mut">yanlış soru</span></div></div></div>
  ${dueC?`<button class="subj" style="margin-bottom:8px" data-go='["kartlar",{}]'><h3>🃏 Bugünün kartları (${dueC})</h3><div class="mut">Bilemediklerin sık, bildiklerin seyrek gelir.</div></button>`:''}
  ${din.map(x=>`<button class="subj" style="margin-bottom:8px" data-go='["okuma","${x.pid}"]'><h3>🗣️ Anlatarak tekrar: ${esc(m.packs[x.pid].title)}</h3><div class="mut">${x.o}. gün tekrarı · dersi aç, sonundaki "Anlat" kutusunda kendi cümlelerinle anlat</div></button>`).join('')}
  ${dueQ?`<button class="subj" style="margin-bottom:8px" data-go='["oturum",{"mode":"due"}]'><h3>🔁 Yanlış yaptığın sorular (${dueQ})</h3><div class="mut">1, 3, 7, 16 ve 35 gün arayla geri gelir.</div></button>`:''}
  ${!dueC&&!din.length&&!dueQ?'<div class="card">Bugün tekrar bekleyen bir şey yok. Yeni bir ders bitirdiğinde kartları ve tekrarları burada göreceksin.</div>':''}
  <h3 class="sec">Atölye</h3><div class="grid">
   <button class="subj" data-go='["kodlar"]'><h3>🔑 Kodlar</h3><div class="mut">${kod} kod</div></button>
   <button class="subj" data-go='["farklar"]'><h3>⚖️ Fark tabloları</h3><div class="mut">${fark} tablo</div></button>
   <button class="subj" data-go='["saraylar"]'><h3>🏨 Saraylar</h3><div class="mut">${saray.length} saray</div></button>
   <button class="subj" data-go='["kartlar",{"hepsi":true,"tum":true}]'><h3>🃏 Bütün kartlar</h3><div class="mut">${cards.length} kart (bitirdiğin derslerden)</div></button>
   ${guide?`<button class="subj" data-go='["okuma","${guide[0]}"]'><h3>📖 Nasıl çalışıyoruz?</h3><div class="mut">Aralıklı tekrar ve 5 teknik</div></button>`:''}
  </div>`,{back:false,tab:'hafiza'});
};
async function toolList(key){const out=[];for(const p of await toolPacks()){const pk=await loadPack(p.pid);for(const x of (pk.tools&&pk.tools[key])||[])out.push(Object.assign({sub:x.sub||pk.subject,src:pk.title},x))}return out}
VIEWS.kodlar=async()=>{const ks=await toolList('kodlar');const by={};ks.forEach(k=>(by[k.sub]=by[k.sub]||[]).push(k));
  shell('Kodlar',Object.entries(by).map(([s,l])=>`<h3 class="sec">${esc(SUBJ_AD[s]||s)}</h3>${l.map(kodHtml).join('')}`).join('')||'<div class="card">Henüz kod yok.</div>',{tab:'hafiza'})};
VIEWS.farklar=async()=>{const fs=await toolList('farklar');const by={};fs.forEach(k=>(by[k.sub]=by[k.sub]||[]).push(k));
  shell('Fark tabloları',Object.entries(by).map(([s,l])=>`<h3 class="sec">${esc(SUBJ_AD[s]||s)}</h3>${l.map(farkHtml).join('')}`).join('')||'<div class="card">Henüz tablo yok.</div>',{tab:'hafiza'});bindFark()};
VIEWS.saraylar=async()=>{const out=[];for(const p of await toolPacks()){const pk=await loadPack(p.pid);if(pk.tools&&pk.tools.saray)out.push(pk)}
  shell('Hafıza sarayları',out.map(pk=>`<button class="subj" style="margin-bottom:8px" data-go='["saray","${pk.pid}"]'><h3>🏨 ${esc(pk.tools.saray.ad)}</h3><div class="mut">${esc(SUBJ_AD[pk.subject]||'')} · ${pk.tools.saray.duraklar.length} durak${S.saray[pk.pid]!=null?' · son yoklama '+S.saray[pk.pid]+'/'+pk.tools.saray.duraklar.length:''}</div></button>`).join('')||'<div class="card">Henüz saray yok.</div>',{tab:'hafiza'})};

/* ---- Tekrar ---- */
VIEWS.tekrar=()=>{
  const due=Object.entries(S.ans).filter(([k,a])=>isDue(a));const later=Object.values(S.ans).filter(a=>a.wrong&&!isDue(a)).length;
  const bySub={};for(const[k,a]of due)bySub[a.sub]=(bySub[a.sub]||0)+1;
  const marked=Object.keys(S.marks).filter(k=>S.marks[k]&&!k.startsWith('read_')).length;
  shell('Tekrar',`<div class="card"><div class="stat"><div><b>${due.length}</b><span class="mut">bugün tekrar</span></div><div><b>${later}</b><span class="mut">ileride tekrar</span></div><div><b>${marked}</b><span class="mut">işaretli</span></div></div></div>
  <p class="mut">Yanlış yaptığın soru ertesi gün, sonra 3, 7, 16 ve 35 gün arayla tekrar gelir. Arka arkaya doğru bilince defterden çıkar.</p>
  ${due.length?`<button class="btn" data-go='["oturum",{"mode":"due"}]'>Hepsini tekrar et (${due.length})</button>`:'<div class="card">Bugün tekrar bekleyen soru yok.</div>'}
  ${Object.entries(bySub).map(([s,n])=>`<button class="subj" style="margin-top:8px" data-go='["oturum",{"mode":"due","sub":"${s}"}]'><h3>${esc(SUBJ_AD[s]||'Deneme')}</h3><div class="mut">${n} soru</div></button>`).join('')}`,{back:false,tab:'tekrar'});
};

/* ---- Ayarlar ---- */
VIEWS.ayar=async()=>{
  const m=await getManifest();const n=Object.values(m.packs).reduce((a,p)=>a+(p.size||0),0);
  shell('Ayarlar',`
  <div class="card"><h3 style="margin:0 0 8px">Çalışma</h3>
   <label>Bir sette kaç soru: <select id="per">${[10,20,30,40].map(x=>`<option ${S.set.per===x?'selected':''}>${x}</option>`).join('')}</select></label><br><br>
   <label>Kalem: <select id="pen"><option value="any" ${S.set.pen==='any'?'selected':''}>Parmak ve kalem çizer</option><option value="pen" ${S.set.pen==='pen'?'selected':''}>Sadece tablet kalemi çizer (avuç içi yok sayılır)</option></select></label></div>
  <div class="card"><h3 style="margin:0 0 8px">Çevrimdışı kullanım</h3><p class="mut">Tüm içerik yaklaşık ${(n/1e6).toFixed(0)} MB. Bir kez indirirsen internet olmadan da çalışır.</p><button class="btn" id="dl">Hepsini cihaza indir</button> <span id="dls" class="mut"></span></div>
  <div class="card"><h3 style="margin:0 0 8px">Yedek</h3><p class="mut">İlerlemeni (cevaplar, tekrar defteri, denemeler) dosyaya al; diğer cihazda "Yedeği yükle" ile aynısını aç. Otomatik eşitleme bir sonraki sürümde geliyor.</p>
   <div class="row"><button class="btn alt" id="exp">Yedeği al</button><label class="btn alt">Yedeği yükle<input type="file" id="imp" accept=".json" hidden></label></div></div>
  <div class="card"><h3 style="margin:0 0 8px">Güvenlik</h3><p class="mut">İçerik şifreli olarak durur, yalnızca parolanla açılır. Bu cihazda parola hatırlanıyor.</p><button class="btn alt" id="lock">Bu cihazda kilitle</button></div>`,{back:false,tab:'ayar'});
  $('#per').onchange=e=>{S.set.per=+e.target.value;save()};$('#pen').onchange=e=>{S.set.pen=e.target.value;save()};
  $('#dl').onclick=async()=>{const ids=Object.keys(m.packs);let k=0;for(const id of ids){$('#dls').textContent=`${++k}/${ids.length}`;try{await loadPack(id)}catch(e){}}$('#dls').textContent='Hazır ✓'};
  $('#exp').onclick=()=>{const name='sgs-yedek-'+new Date().toISOString().slice(0,10)+'.json',txt=JSON.stringify({v:1,t:Date.now(),S});if(window.SGSAndroid){SGSAndroid.save(name,txt);toast('İndirilenler klasörüne kaydedildi');return}const b=new Blob([txt],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sgs-yedek-'+new Date().toISOString().slice(0,10)+'.json';a.click()};
  $('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(confirm('Bu cihazdaki ilerlemenin yerine yedek yüklensin mi?')){S=Object.assign(S,x.S);save();toast('Yedek yüklendi')}}catch(err){toast('Dosya okunamadı')}};
  $('#lock').onclick=async()=>{await idb.del('kv','key');KEY=null;lockScreen()};
};

/* ====== Kilit ====== */
function lockScreen(msg){
  app.innerHTML=`<div class="lock"><div class="card"><div style="font-size:42px">📘</div><h2>SGS Çalışma</h2><p class="mut">Sana özel, şifreli çalışma alanı.</p>
  <input type="password" id="pw" placeholder="Parola" autocomplete="current-password"><button class="btn" id="un" style="width:100%;margin-top:10px">Aç</button><p id="msg" class="mut">${esc(msg||'')}</p></div></div>`;
  const go_=async()=>{$('#msg').innerHTML='<span class="spin"></span>';try{await unlock($('#pw').value);ROUTE=[];go('bugun')}catch(e){$('#msg').textContent=e.message==='Bağlantı yok'?'İlk açılışta internet gerekiyor.':'Parola yanlış.'}};
  $('#un').onclick=go_;$('#pw').onkeydown=e=>{if(e.key==='Enter')go_()};
}
(async()=>{
  loadState();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  try{KEY=await idb.get('kv','key')}catch(e){}
  if(KEY){await getManifest();go('bugun')}else lockScreen();
})();
</script>
</body>
